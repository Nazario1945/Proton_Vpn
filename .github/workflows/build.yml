name: Build Proton VPN Debug

on:
  workflow_dispatch: # Permite iniciar la compilación a mano desde la página

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Dar permisos a Gradlew
        run: chmod +x gradlew

      - name: Compilar APK (Debug)
        run: ./gradlew assembleProductionVanillaOpenSourceDebug

      - name: Subir el APK
        uses: actions/upload-artifact@v4
        with:
          name: ProtonVPN-Debug-APK
          path: app/build/outputs/apk/**/*.apk

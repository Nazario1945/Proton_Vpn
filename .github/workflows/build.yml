name: Build Proton VPN Release (Unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      OVERRIDE_VERSION_NAME: "5.20.98.0"

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Crear directorio de esquemas de Room
        run: mkdir -p app/schemas

      - name: Dar permisos a Gradlew
        run: chmod +x gradlew

      - name: Compilar APK (Release Unsigned)
        run: ./gradlew assembleProductionVanillaOpenSourceRelease

      - name: Subir el APK
        uses: actions/upload-artifact@v4
        with:
          name: ProtonVPN-Release-Unsigned
          path: app/build/outputs/apk/**/*.apk

herename: Build Proton VPN Release Signed

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      OVERRIDE_VERSION_NAME: "5.20.98.0"

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Crear directorio de esquemas de Room
        run: mkdir -p app/schemas

      - name: Decodificar Keystore JKS
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > proton_final.jks

      - name: Dar permisos a Gradlew
        run: chmod +x gradlew

      - name: Compilar APK (Release Firmado)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/proton_final.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleProductionVanillaOpenSourceRelease

      - name: Verificar Firma
        run: |
          echo "=== VERIFICANDO FIRMA DEL APK ==="
          jarsigner -verify -verbose -certs app/build/outputs/apk/**/*.apk | grep -i "CN="
          echo "================================="

      - name: Subir el APK Firmado
        uses: actions/upload-artifact@v4
        with:
          name: ProtonVPN-Release-Signed-Final
          path: app/build/outputs/apk/**/*.apk

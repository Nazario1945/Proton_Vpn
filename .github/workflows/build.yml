name: Build Proton VPN Debug

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      OVERRIDE_VERSION_NAME: "5.20.98.0" # Soluciona el error del Tag (null)

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # Ya no necesitamos bajar todo el historial

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Crear directorio de esquemas de Room
        run: mkdir -p app/schemas # Esto soluciona el error de Room

      - name: Dar permisos a Gradlew
        run: chmod +x gradlew

      - name: Compilar APK (Debug)
        run: ./gradlew assembleProductionVanillaOpenSourceDebug

      - name: Subir el APK
        uses: actions/upload-artifact@v4
        with:
          name: ProtonVPN-Debug-APK
          path: app/build/outputs/apk/**/*.apk
